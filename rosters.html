<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>League Rosters | Baseball For Bums</title>
  <meta name="description" content="Baseball For Bums rosters — all six teams (Renegades, See Ya!, Hurricanes, Elite, Legends, Cut Fresh), every player, team records and top performers.">
  <link rel="canonical" href="https://baseballforbums.com/rosters">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="League Rosters | Baseball For Bums">
  <meta property="og:url" content="https://baseballforbums.com/rosters">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚾%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=8">

  <style>
    .team-jump { position: sticky; top: calc(var(--header-h) + 30px); z-index: 50; padding: 10px 0; margin-bottom: 8px; background: linear-gradient(180deg, var(--bg) 70%, transparent); }
    .roster-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
    .roster { scroll-margin-top: calc(var(--header-h) + 100px); }
    .roster.target { box-shadow: 0 0 0 2px var(--team), var(--shadow); }
    .roster-top { position: relative; padding: 20px 20px 16px; overflow: hidden; }
    .roster-top::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at top right, var(--team), transparent 65%); opacity: .12; pointer-events: none; }
    .roster-name { position: relative; display: flex; align-items: center; gap: 12px; }
    .roster-name .bar { width: 5px; height: 40px; border-radius: 3px; background: var(--team); box-shadow: 0 0 14px var(--team); }
    .roster-name h2 { flex: 1; font-size: 1.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; }
    .roster-links { position: relative; display: flex; gap: 14px; margin-top: 10px; font-size: .84rem; }
    .roster-links a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .roster-links a:hover { text-decoration: underline; }
    .team-stats { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .team-stats div { padding: 10px 4px; text-align: center; border-right: 1px solid var(--line); }
    .team-stats div:last-child { border-right: 0; }
    .team-stats b { display: block; font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; line-height: 1; }
    .team-stats small { display: block; margin-top: 4px; font-family: var(--font-display); font-size: .64rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
    .performers { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .players { list-style: none; padding: 8px; }
    .players li a, .players .hdr { display: grid; grid-template-columns: 28px minmax(0,1fr) 40px 40px 40px 52px; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 9px; text-decoration: none; }
    .players li a:hover { background: rgba(13,34,64,.04); }
    .players li.hit a { background: rgba(59,158,230,.08); }
    .players .hdr { font-family: var(--font-display); font-size: .66rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); padding-bottom: 4px; }
    .players .nm { font-family: var(--font-display); font-weight: 700; font-size: 1.02rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .players .nm mark { background: rgba(59,158,230,.25); color: var(--gold); border-radius: 3px; padding: 0 2px; }
    .players .s { text-align: right; font-family: var(--font-display); font-weight: 700; color: var(--text-2); }
    .players .avg { text-align: right; font-family: var(--font-display); font-weight: 900; color: var(--gold); }
    .players .i { font-family: var(--font-display); font-weight: 700; color: var(--faint); text-align: center; }
    @media (max-width: 960px) {
      .roster-grid { grid-template-columns: 1fr; }
      .team-stats { grid-template-columns: repeat(3, 1fr); }
      .team-stats div:nth-child(3) { border-right: 0; }
      .team-stats div:nth-child(n+4) { border-top: 1px solid var(--line); }
    }
    @media (max-width: 520px) {
      .players li a, .players .hdr { grid-template-columns: 24px minmax(0,1fr) 40px 52px; }
      .players .s.h, .players .s.hr { display: none; }
    }
  </style>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="wrap">
      <nav data-crumbs aria-label="Breadcrumb"></nav>
      <div class="page-hero-inner">
        <div>
          <div class="eyebrow">Spring 2026 Season</div>
          <h1 class="page-title">League Rosters</h1>
          <p class="page-lede">Team stats, records and full player listings. Tap a player to see their full stat line.</p>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr-only">Search team or player</span>
          <input type="search" id="search" placeholder="Search team or player…" autocomplete="off">
        </label>
        <span class="spacer"></span>
        <span class="count-label" id="summary"></span>
      </div>
      <div class="team-jump"><div class="pills pills-scroll" id="jump-bar" aria-label="Jump to team"></div></div>
      <div id="content"><div class="roster-grid">
        <div class="card"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div>
        <div class="card"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></div>
      </div></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/shared.js?v=8"></script>
<script src="/header.js?v=13"></script>
<script>
(function () {
  var B = window.BFB, esc = B.esc;

  function highlight(text, term) {
    var safe = esc(text);
    if (!term) return safe;
    var re = new RegExp("(" + esc(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    return safe.replace(re, "<mark>$1</mark>");
  }

  function groupRosters(rows) {
    var map = {};
    rows.forEach(function (r) {
      var teamName = r.team_name || r.team || r.Team || "";
      var name = (r.full_name || r.player_name || [r.first_name || "", r.last_name || ""].join(" ")).trim();
      if (!teamName || !name) return;
      var t = B.team(r.team_id || teamName);
      var id = t ? t.id : (r.team_id || B.slugify(teamName));
      if (!map[id]) map[id] = { id: id, name: t ? t.name : teamName, color: t ? t.color : "#888", players: [] };
      map[id].players.push(name);
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function statsByTeam(rows) {
    var m = {};
    rows.forEach(function (r) {
      var t = B.team(r.team_id || r.team), id = t ? t.id : B.slugify(r.team);
      (m[id] = m[id] || {})[(r.player_name || r.full_name || "").trim()] = r;
    });
    return m;
  }

  function standingsByTeam(rows) {
    var m = {};
    (rows || []).forEach(function (r) {
      var t = B.team(r.team_id || r.team), id = t ? t.id : B.slugify(r.team);
      m[id] = { w: B.num(r.w || r.wins), l: B.num(r.l || r.losses), gp: B.num(r.gp), rf: B.num(r.rf || r.rs), ra: B.num(r.ra), diff: B.num(r.diff != null ? r.diff : r.rd) };
    });
    return m;
  }

  function performers(players, ps) {
    var best = { avg: null, rbi: null, hr: null };
    players.forEach(function (n) {
      var s = ps[n]; if (!s) return;
      if (B.num(s.ab) >= 5 && (!best.avg || B.num(s.avg) > B.num(best.avg.avg))) best.avg = s;
      if (!best.rbi || B.num(s.rbi) > B.num(best.rbi.rbi)) best.rbi = s;
      if (!best.hr || B.num(s.hr) > B.num(best.hr.hr)) best.hr = s;
    });
    var chips = [];
    if (best.avg) chips.push(["AVG", best.avg, B.fmtRate(best.avg.avg)]);
    if (best.rbi && B.num(best.rbi.rbi) > 0) chips.push(["RBI", best.rbi, B.fmtInt(best.rbi.rbi)]);
    if (best.hr && B.num(best.hr.hr) > 0) chips.push(["HR", best.hr, B.fmtInt(best.hr.hr)]);
    return chips.map(function (c) {
      var n = c[1].player_name || c[1].full_name;
      return '<a class="chip" href="/stats?q=' + encodeURIComponent(n) + '" style="text-decoration:none">' + c[0] + ' <span style="color:var(--text)">' + esc(n) + '</span> <span style="color:var(--gold)">' + c[2] + '</span></a>';
    }).join("");
  }

  var TEAMS = [], PS = {}, TS = {};

  function render(term) {
    var q = (term || "").trim().toLowerCase();
    var visible = TEAMS.map(function (t) {
      var teamHit = q && t.name.toLowerCase().indexOf(q) > -1;
      var players = q && !teamHit ? t.players.filter(function (n) { return n.toLowerCase().indexOf(q) > -1; }) : t.players;
      return (!q || teamHit || players.length) ? { t: t, players: players } : null;
    }).filter(Boolean);

    var total = visible.reduce(function (s, v) { return s + v.players.length; }, 0);
    document.getElementById("summary").textContent = visible.length + " teams · " + total + " players";
    document.getElementById("jump-bar").innerHTML = visible.map(function (v) {
      return '<a class="pill" href="#team-' + v.t.id + '"><span class="dot" style="background:' + v.t.color + '"></span>' + esc(v.t.name) + '</a>';
    }).join("");

    if (!visible.length) {
      document.getElementById("content").innerHTML = '<div class="card"><div class="empty"><div class="empty-title">No results</div>Nothing matches “' + esc(term) + '”. Try the <a href="/stats?q=' + encodeURIComponent(term) + '" style="color:var(--gold)">stats search</a>.</div></div>';
      return;
    }

    document.getElementById("content").innerHTML = '<div class="roster-grid">' + visible.map(function (v) {
      var t = v.t, ps = PS[t.id] || {}, ts = TS[t.id] || {};
      var w = ts.w || 0, l = ts.l || 0, gp = ts.gp || 0, diff = ts.diff || 0;
      var rec = gp ? w + "W – " + l + "L" : "No games yet";
      var recCls = w > l ? "chip-green" : w < l ? "chip-red" : "chip-gold";
      var list = v.players.map(function (n) {
        var s = ps[n] || {};
        return { n: n, avg: B.num(s.avg), h: B.num(s.h), rbi: B.num(s.rbi), hr: B.num(s.hr), ab: B.num(s.ab) };
      }).sort(function (a, b) { return (b.avg - a.avg) || a.n.localeCompare(b.n); });

      return '<article class="card roster" id="team-' + t.id + '" style="--team:' + t.color + '">' +
        '<div class="roster-top"><div class="roster-name"><span class="bar"></span><h2>' + highlight(t.name, term) + '</h2><span class="chip ' + recCls + '">' + rec + '</span></div>' +
        '<div class="roster-links"><a href="/schedule?team=' + t.id + '">Schedule →</a><a href="/stats?team=' + t.id + '">Team stats →</a></div></div>' +
        '<div class="team-stats">' +
          '<div><b style="color:var(--gold)">' + (gp ? B.fmtRate(w / gp) : ".000") + '</b><small>PCT</small></div>' +
          '<div><b>' + gp + '</b><small>GP</small></div>' +
          '<div><b style="color:var(--green)">' + w + '</b><small>W</small></div>' +
          '<div><b style="color:var(--red)">' + l + '</b><small>L</small></div>' +
          '<div><b>' + (ts.rf || 0) + '</b><small>RS</small></div>' +
          '<div><b class="' + B.rdClass(diff) + '">' + B.fmtRD(diff) + '</b><small>RD</small></div>' +
        '</div>' +
        (function () { var p = performers(t.players, ps); return p ? '<div class="performers">' + p + '</div>' : ''; })() +
        '<ol class="players"><li class="hdr" aria-hidden="true"><span>#</span><span>Player</span><span class="s h">H</span><span class="s">RBI</span><span class="s hr">HR</span><span class="avg" style="color:var(--gold)">AVG</span></li>' +
        list.map(function (p, i) {
          var hit = q && p.n.toLowerCase().indexOf(q) > -1;
          return '<li' + (hit ? ' class="hit"' : '') + '><a href="/stats?q=' + encodeURIComponent(p.n) + '">' +
            '<span class="i">' + (i + 1) + '</span><span class="nm">' + highlight(p.n, term) + '</span>' +
            '<span class="s h">' + (p.ab ? p.h : "—") + '</span><span class="s">' + (p.ab ? p.rbi : "—") + '</span><span class="s hr">' + (p.hr || "—") + '</span>' +
            '<span class="avg">' + (p.ab >= 3 ? B.fmtRate(p.avg) : "—") + '</span></a></li>';
        }).join("") + '</ol></article>';
    }).join("") + '</div>';
  }

  function highlightTarget() {
    document.querySelectorAll(".roster.target").forEach(function (e) { e.classList.remove("target"); });
    if (!location.hash) return;
    var el = document.getElementById(location.hash.slice(1));
    if (el && el.classList.contains("roster")) { el.classList.add("target"); el.scrollIntoView(); }
  }
  window.addEventListener("hashchange", highlightTarget);

  Promise.allSettled([loadData("Web_Rosters"), loadData("Web_Player_Stats"), loadData("Standings")]).then(function (res) {
    var rosters = res[0].status === "fulfilled" ? res[0].value : [];
    if (!rosters.length) {
      document.getElementById("content").innerHTML = '<div class="card"><div class="empty">Unable to load rosters right now — please refresh in a minute.</div></div>';
      return;
    }
    TEAMS = groupRosters(rosters);
    PS = statsByTeam(res[1].status === "fulfilled" ? res[1].value : []);
    TS = standingsByTeam(res[2].status === "fulfilled" ? res[2].value : []);
    var s = document.getElementById("search");
    render(s.value);
    highlightTarget();
    s.addEventListener("input", function () { render(s.value); });
  });
})();
</script>
</body>
</html>
