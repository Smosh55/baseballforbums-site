<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Player Stats | Baseball For Bums</title>
  <meta name="description" content="Baseball For Bums player stats — batting average, OBP, SLG, OPS, home runs, RBI, hits and stolen bases for every player, with leaderboards.">
  <link rel="canonical" href="https://baseballforbums.com/stats">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Player Stats | Baseball For Bums">
  <meta property="og:url" content="https://baseballforbums.com/stats">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⚾%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app.css?v=8">

  <style>
    .lb-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: start; }
    .lb-podium { padding: 18px; display: grid; gap: 8px; }
    .lb-row { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px; background: rgba(13,34,64,.025); border: 1px solid rgba(13,34,64,.05); text-decoration: none; cursor: pointer; }
    .lb-row:hover { background: rgba(13,34,64,.05); }
    .lb-row:first-child { background: rgba(245,197,66,.07); border-color: rgba(245,197,66,.28); }
    .lb-row b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-row small { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .76rem; }
    .lb-row .val { font-family: var(--font-display); font-weight: 900; font-size: 1.6rem; color: var(--gold); }
    .lb-row:first-child .val { font-size: 1.9rem; color: var(--gold); }
    .lb-desc { font-size: .82rem; color: var(--muted); font-family: var(--font-body); font-weight: 500; letter-spacing: 0; text-transform: none; }
    .min-ab { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); cursor: pointer; user-select: none; }
    .min-ab input { width: 18px; height: 18px; min-height: 0; accent-color: var(--accent); }
    td.player { text-align: left; }
    td.player b { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; color: var(--text); }
    td.player small { display: flex; align-items: center; gap: 6px; font-size: .74rem; color: var(--muted); font-family: var(--font-body); font-weight: 500; }
    td.player small a { color: var(--muted); text-decoration: none; }
    td.player small a:hover { color: var(--text); text-decoration: underline; }
    .player-cell { display: flex; align-items: center; gap: 12px; }
    tr.flash td { animation: flash 1.6s ease; }
    @keyframes flash { 0%,40% { background: rgba(59,158,230,.16); } 100% { background: transparent; } }
    .data-table th:first-child, .data-table td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
    .data-table th:first-child { z-index: 2; background: var(--surface-2); }
    @media (max-width: 960px) { .lb-grid { grid-template-columns: 1fr; } }

    .hero-split { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 24px; align-items: end; }
    .hero-batter { position: relative; height: 270px; margin-bottom: -30px; display: flex; justify-content: center; align-items: flex-end; }
    .hero-batter::before { content: ""; position: absolute; bottom: 6px; left: 50%; width: 170px; height: 18px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(13,34,64,.22), transparent 70%); }
    .hero-batter img { position: relative; height: 100%; width: auto; }
    @media (max-width: 760px) {
      .hero-split { grid-template-columns: 1fr 120px; gap: 8px; }
      .hero-batter { height: 150px; margin-bottom: -30px; }
      .hero-batter::before { width: 100px; }
    }
    @media print { .hero-batter { display: none; } }

  </style>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="wrap hero-split">
      <div>
        <nav data-crumbs aria-label="Breadcrumb"></nav>
        <div class="eyebrow">Spring 2026 Season</div>
        <h1 class="page-title">Player Stats</h1>
        <p class="page-lede">Full batting statistics · Updated after every game. Search a player or team, or click any column to sort.</p>
        <div class="page-hero-aside" style="margin-top:16px;"><span class="chip chip-gold" id="player-count">⚾ 2026 Season</span></div>
      </div>
      <div class="hero-batter" aria-hidden="true">
        <img src="/media/batter.webp" alt="" width="505" height="520" decoding="async">
      </div>
    </div>
  </section>

  <section class="section" id="leaderboards">
    <div class="wrap">
      <div class="section-head"><h2>Leaderboards</h2></div>
      <div class="pills pills-scroll" id="lb-tabs" role="tablist" aria-label="Leaderboard category" style="margin-bottom:16px;"></div>
      <div class="card" id="lb-card">
        <div class="card-head">
          <span class="card-title" id="lb-title">Leaders</span>
          <button class="btn btn-sm" type="button" id="lb-see-all">Sort full table ↓</button>
        </div>
        <div class="lb-grid">
          <div class="lb-podium" id="lb-list"></div>
          <div class="card-body" id="lb-about" style="color:var(--text-2);font-size:.92rem;line-height:1.7;"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="full-stats">
    <div class="wrap">
      <div class="section-head"><h2>Full stats table</h2></div>
      <div class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="sr-only">Search players or teams</span>
          <input type="search" id="search" placeholder="Search player or team…" autocomplete="off">
        </label>
        <select id="team-filter" aria-label="Filter by team"><option value="">All teams</option></select>
        <label class="min-ab"><input type="checkbox" id="qualified"> Min 10 AB</label>
        <span class="spacer"></span>
        <span class="count-label" id="stats-count"></span>
      </div>
      <div class="card">
        <div class="table-scroll" style="max-height:78vh;">
          <table class="data-table" id="stats-table">
            <thead><tr id="stats-head"></tr></thead>
            <tbody id="rows"><tr><td colspan="15"><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/shared.js?v=8"></script>
<script src="/header.js?v=13"></script>
<script>
(function () {
  var B = window.BFB, esc = B.esc;

  var COLS = [
    { key: "player_name", label: "Player", text: true },
    { key: "gp",  label: "GP" }, { key: "ab", label: "AB" }, { key: "h", label: "H" },
    { key: "1b",  label: "1B" }, { key: "2b", label: "2B" }, { key: "3b", label: "3B" },
    { key: "hr",  label: "HR" }, { key: "rbi", label: "RBI" }, { key: "r", label: "R" },
    { key: "bb",  label: "BB" }, { key: "sb", label: "SB" },
    { key: "avg", label: "AVG", rate: true }, { key: "obp", label: "OBP", rate: true },
    { key: "slg", label: "SLG", rate: true }, { key: "ops", label: "OPS", rate: true }
  ];

  var LB = [
    { key: "ops", label: "OPS",     name: "OPS Leaders",     desc: "On-base + slugging — the best all-around measure of a hitter.", rate: true },
    { key: "avg", label: "AVG",     name: "Batting Average", desc: "Hits divided by at-bats.", rate: true },
    { key: "obp", label: "OBP",     name: "On-Base %",       desc: "How often a hitter reaches base per plate appearance.", rate: true },
    { key: "slg", label: "SLG",     name: "Slugging %",      desc: "Total bases per at-bat — rewards extra-base hits.", rate: true },
    { key: "hr",  label: "HR",      name: "Home Runs",       desc: "Balls over the fence (or around the bases)." },
    { key: "rbi", label: "RBI",     name: "Runs Batted In",  desc: "Runs driven in this season." },
    { key: "h",   label: "Hits",    name: "Hits",            desc: "Total base hits." },
    { key: "2b",  label: "2B",      name: "Doubles",         desc: "Two-base hits." },
    { key: "3b",  label: "3B",      name: "Triples",         desc: "Three-base hits." },
    { key: "1b",  label: "1B",      name: "Singles",         desc: "One-base hits." },
    { key: "r",   label: "Runs",    name: "Runs Scored",     desc: "Times crossing the plate." },
    { key: "sb",  label: "SB",      name: "Stolen Bases",    desc: "Speed on the base paths." },
    { key: "gp",  label: "GP",      name: "Games Played",    desc: "Appearances this season." }
  ];
  var MIN_AB = 10;

  var STATS = [], state = { sort: "ops", q: "", team: "", qualified: false, lb: "ops" };

  function getName(r) { return r.player_name || r.full_name || r.Name || "Unknown"; }
  function getTeam(r) { return r.team || r.team_name || r.Team || ""; }
  function cell(r, c) { return c.rate ? B.fmtRate(r[c.key]) : B.fmtInt(r[c.key]); }

  function syncUrl() {
    var u = new URL(location.href);
    ["q", "team", "sort"].forEach(function (k) {
      var v = k === "sort" ? (state.sort === "ops" ? "" : state.sort) : state[k];
      if (v) u.searchParams.set(k, v); else u.searchParams.delete(k);
    });
    history.replaceState(null, "", u.pathname + u.search + u.hash);
  }

  /* ── leaderboards ── */
  function renderLB() {
    var cfg = LB.filter(function (c) { return c.key === state.lb; })[0];
    document.querySelectorAll("#lb-tabs .pill").forEach(function (p) { p.setAttribute("aria-selected", String(p.dataset.lb === cfg.key)); });
    document.getElementById("lb-title").innerHTML = esc(cfg.name) + (cfg.rate ? ' <span class="lb-desc">· min ' + MIN_AB + ' AB</span>' : '');
    var top = STATS.filter(function (r) { return B.num(r[cfg.key]) > 0 && (!cfg.rate || B.num(r.ab) >= MIN_AB); })
      .sort(function (a, b) { return B.num(b[cfg.key]) - B.num(a[cfg.key]); }).slice(0, 10);
    document.getElementById("lb-list").innerHTML = top.map(function (r, i) {
      var n = getName(r), t = getTeam(r);
      return '<div class="lb-row" data-player="' + esc(n) + '" role="button" tabindex="0"><span class="rank rank-' + (i + 1) + '">' + (i + 1) + '</span>' +
        '<span style="min-width:0"><b>' + esc(n) + '</b><small><span class="dot" style="background:' + B.teamColor(t) + '"></span>' + esc(t) + '</small></span>' +
        '<span class="val">' + (cfg.rate ? B.fmtRate(r[cfg.key]) : B.fmtInt(r[cfg.key])) + '</span></div>';
    }).join("") || '<div class="empty">No data yet.</div>';

    var leader = top[0];
    var teamTotals = {};
    STATS.forEach(function (r) { var t = getTeam(r); if (!cfg.rate) teamTotals[t] = (teamTotals[t] || 0) + B.num(r[cfg.key]); });
    var bestTeam = Object.keys(teamTotals).sort(function (a, b) { return teamTotals[b] - teamTotals[a]; })[0];
    document.getElementById("lb-about").innerHTML =
      '<p style="margin-bottom:12px;">' + esc(cfg.desc) + '</p>' +
      (leader ? '<p><b style="color:var(--text)">' + esc(getName(leader)) + '</b> (' + esc(getTeam(leader)) + ') leads the league with <b style="color:var(--gold)">' + (cfg.rate ? B.fmtRate(leader[cfg.key]) : B.fmtInt(leader[cfg.key])) + '</b>.</p>' : '') +
      (bestTeam && !cfg.rate ? '<p style="margin-top:8px;">Team leader: <b style="color:var(--text)">' + esc(bestTeam) + '</b> with ' + teamTotals[bestTeam] + ' total.</p>' : '') +
      '<p style="margin-top:14px;"><a href="/standings#leaders" style="color:var(--gold);font-weight:600;">League leaders on Standings →</a></p>';
  }

  function buildLBTabs() {
    var el = document.getElementById("lb-tabs");
    el.innerHTML = LB.map(function (c) { return '<button class="pill" type="button" role="tab" data-lb="' + c.key + '">' + c.label + '</button>'; }).join("");
    el.addEventListener("click", function (e) { var b = e.target.closest(".pill"); if (b) { state.lb = b.dataset.lb; renderLB(); } });
    document.getElementById("lb-see-all").addEventListener("click", function () {
      state.sort = state.lb; renderTable(); syncUrl();
      document.getElementById("full-stats").scrollIntoView({ behavior: "smooth" });
    });
    document.getElementById("lb-list").addEventListener("click", function (e) {
      var row = e.target.closest(".lb-row"); if (!row) return;
      focusPlayer(row.dataset.player);
    });
    document.getElementById("lb-list").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { var row = e.target.closest(".lb-row"); row && focusPlayer(row.dataset.player); }
    });
  }

  function focusPlayer(name) {
    state.q = name; state.team = "";
    document.getElementById("search").value = name;
    document.getElementById("team-filter").value = "";
    renderTable(); syncUrl();
    document.getElementById("full-stats").scrollIntoView({ behavior: "smooth" });
  }

  /* ── table ── */
  function renderHead() {
    document.getElementById("stats-head").innerHTML = COLS.map(function (c) {
      var sorted = c.key === state.sort;
      return '<th scope="col" class="' + (c.text ? "l" : "") + '"' + (sorted ? ' aria-sort="descending"' : '') + '><button type="button" data-col="' + c.key + '">' + c.label + '</button></th>';
    }).join("");
  }

  function renderTable() {
    renderHead();
    var q = state.q.trim().toLowerCase();
    var rows = STATS.filter(function (r) {
      if (state.team && B.slugify(getTeam(r)) !== state.team && (B.team(getTeam(r)) || {}).id !== state.team) return false;
      if (state.qualified && B.num(r.ab) < MIN_AB) return false;
      return !q || getName(r).toLowerCase().indexOf(q) > -1 || getTeam(r).toLowerCase().indexOf(q) > -1;
    });
    var col = COLS.filter(function (c) { return c.key === state.sort; })[0] || COLS[COLS.length - 1];
    rows.sort(col.text
      ? function (a, b) { return getName(a).localeCompare(getName(b)); }
      : function (a, b) { return B.num(b[col.key]) - B.num(a[col.key]); });

    document.getElementById("stats-count").textContent = rows.length + " player" + (rows.length === 1 ? "" : "s");
    document.getElementById("rows").innerHTML = rows.map(function (r, i) {
      var n = getName(r), t = getTeam(r), team = B.team(t);
      return '<tr' + (q && rows.length === 1 ? ' class="flash"' : '') + '><td class="player"><div class="player-cell">' +
        '<span class="rank' + (!col.text && i < 3 ? ' rank-' + (i + 1) : '') + '">' + (i + 1) + '</span>' +
        '<span><b>' + esc(n) + '</b><small><span class="dot" style="background:' + B.teamColor(t) + '"></span><a href="/rosters#team-' + (team ? team.id : B.slugify(t)) + '">' + esc(t) + '</a></small></span></div></td>' +
        COLS.slice(1).map(function (c) {
          return '<td class="' + (c.rate ? 'rate ' : '') + (c.key === state.sort ? 'sorted' : '') + '">' + cell(r, c) + '</td>';
        }).join("") + '</tr>';
    }).join("") || '<tr><td colspan="' + COLS.length + '" class="c" style="padding:36px;color:var(--muted);font-family:var(--font-body);font-weight:500;">No players match. <a href="/stats" style="color:var(--gold)">Clear filters</a></td></tr>';
  }

  function wire() {
    var s = document.getElementById("search"), tf = document.getElementById("team-filter"), qa = document.getElementById("qualified");
    tf.innerHTML += B.TEAMS.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + '</option>'; }).join("");
    s.value = state.q; tf.value = state.team;
    s.addEventListener("input", function () { state.q = s.value; renderTable(); syncUrl(); });
    tf.addEventListener("change", function () { state.team = tf.value; renderTable(); syncUrl(); });
    qa.addEventListener("change", function () { state.qualified = qa.checked; renderTable(); });
    document.getElementById("stats-head").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-col]"); if (!b) return;
      state.sort = b.dataset.col; renderTable(); syncUrl();
    });
  }

  // Deep links: /stats?q=Name  /stats?team=legends  /stats?sort=hr
  state.q = B.qs("q");
  var qt = B.team(B.qs("team")); if (qt) state.team = qt.id;
  var qsort = B.qs("sort"); if (COLS.some(function (c) { return c.key === qsort; })) { state.sort = qsort; if (LB.some(function (c) { return c.key === qsort; })) state.lb = qsort; }
  // A team name typed as ?q= becomes a team filter
  if (state.q && B.team(state.q)) { state.team = B.team(state.q).id; state.q = ""; }

  buildLBTabs();
  wire();

  loadData("Web_Player_Stats").then(function (stats) {
    if (!Array.isArray(stats) || !stats.length) throw new Error("No stats available yet.");
    stats.forEach(function (r) {
      if (r["1b"] == null || r["1b"] === "") r["1b"] = Math.max(0, B.num(r.h) - B.num(r["2b"]) - B.num(r["3b"]) - B.num(r.hr));
    });
    STATS = stats;
    document.getElementById("player-count").textContent = "⚾ " + stats.length + " players";
    renderLB();
    renderTable();
    if (B.qs("q") || B.qs("team") || B.qs("sort")) setTimeout(function () { document.getElementById("full-stats").scrollIntoView(); }, 150);
  }).catch(function (err) {
    document.getElementById("rows").innerHTML = '<tr><td colspan="' + COLS.length + '" class="c" style="padding:36px;color:var(--muted);font-family:var(--font-body);">' + esc(err.message || "Stats are unavailable right now.") + '</td></tr>';
    document.getElementById("lb-list").innerHTML = '<div class="empty">No data yet.</div>';
  });
})();
</script>
</body>
</html>
